<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; font-src 'self'; img-src 'self'; connect-src 'none'; object-src 'none'; base-uri 'none'; form-action 'none'">
  <title>Terminal</title>
  <link rel="stylesheet" href="app.css">
</head>
<body>
<header>
  <div class="brand"><img class="brand-icon" src="terminal.png" alt=""> Terminal</div>
  <div class="header-actions">
    <button id="new-tab" data-i18n-title="ssh.shortcut">+ SSH</button>
    <button id="new-local" data-i18n="local.new"></button>
    <button id="appearance-open"><span aria-hidden="true">◐</span> <span data-i18n="appearance.open"></span></button>
    <button id="settings-open"><span aria-hidden="true">⚙</span> <span data-i18n="settings.open"></span></button>
  </div>
</header>
<nav id="tabs" data-i18n-label="terminal.tabs"></nav>
<div class="toolbar">
  <span id="connection-state"></span>
  <div>
    <button id="reconnect" data-i18n="ssh.reconnect" hidden></button>
    <button id="find-open" title="Ctrl+Shift+F" data-i18n="search.open"></button>
    <button id="markdown-open" title="Ctrl+Shift+M" data-i18n="reader.title"></button>
    <button id="copy-output" data-i18n="clipboard.copy"></button>
  </div>
</div>
<div id="find-bar" hidden>
  <input id="find-input" data-i18n-placeholder="search.placeholder" data-i18n-label="search.placeholder">
  <button id="find-prev" data-i18n-label="search.previous">↑</button>
  <button id="find-next" data-i18n-label="search.next">↓</button>
  <span id="find-result"></span>
  <button id="find-close" data-i18n="common.close"></button>
</div>
<main>
  <section id="workspace">
    <div id="welcome">
      <h1 data-i18n="home.heading"></h1>
      <div class="row">
        <button id="welcome-connect" class="primary" data-i18n="ssh.open"></button>
        <button id="welcome-local" data-i18n="local.open"></button>
      </div>
      <div class="shortcut-hint" data-i18n="home.shortcuts"></div>
    </div>
  </section>
  <aside id="markdown-panel" hidden>
    <div class="panel-heading">
      <span data-i18n="reader.title"></span>
      <button id="markdown-close" data-i18n="common.close"></button>
    </div>
    <p class="muted" data-i18n="reader.hint"></p>
    <div class="md-actions">
      <button id="markdown-refresh" data-i18n="reader.refresh"></button>
      <button id="markdown-edit" data-i18n="reader.edit"></button>
    </div>
    <textarea id="markdown-source" data-i18n-label="reader.source" maxlength="500000" hidden></textarea>
    <article id="markdown-content"></article>
  </aside>
</main>
<footer><span id="session-info"></span><span id="resource-info">Terminal 0.3</span></footer>

<dialog id="local-dialog" aria-labelledby="local-title">
  <form id="local-form">
    <div class="dialog-heading">
      <h2 id="local-title" data-i18n="local.open"></h2>
      <button type="button" data-close="local-dialog" data-i18n-label="common.close">✕</button>
    </div>
    <button type="submit" name="shell" value="bash">Bash</button>
    <button type="submit" name="shell" value="zsh">Zsh</button>
  </form>
</dialog>

<dialog id="connect-dialog" aria-labelledby="connect-title">
  <form id="connect-form">
    <div class="dialog-heading">
      <h2 id="connect-title" data-i18n="ssh.connectTitle"></h2>
      <button type="button" data-close="connect-dialog" data-i18n-label="common.close">✕</button>
    </div>
    <label><span data-i18n="ssh.saved"></span><select id="saved-profile"></select></label>
    <p id="config-info" class="muted"></p>
    <button type="button" id="config-refresh" data-i18n="ssh.refreshConfig"></button>
    <div class="row">
      <label class="grow"><span data-i18n="ssh.name"></span><input id="profile-name" data-i18n-placeholder="ssh.namePlaceholder"></label>
      <label class="port"><span data-i18n="ssh.port"></span><input id="port" type="number" min="1" max="65535" value="22" required></label>
    </div>
    <label><span data-i18n="ssh.host"></span><input id="host" data-i18n-placeholder="ssh.hostPlaceholder" required autocomplete="off"></label>
    <label><span data-i18n="ssh.username"></span><input id="username" placeholder="ubuntu" required autocomplete="off"></label>
    <label>
      <span data-i18n="ssh.authMethod"></span>
      <select id="auth">
        <option value="key" data-i18n="ssh.key"></option>
        <option value="agent" data-i18n="ssh.agent"></option>
        <option value="password" data-i18n="ssh.password"></option>
        <option value="config" data-i18n="ssh.useConfig"></option>
      </select>
    </label>
    <div id="key-fields">
      <label><span data-i18n="ssh.keyFile"></span><div class="row"><input id="key-path" class="grow" readonly data-i18n-placeholder="ssh.keyPlaceholder"><button id="key-choose" type="button" data-i18n="ssh.chooseFile"></button></div></label>
      <label><span data-i18n="ssh.passphraseOptional"></span><input id="passphrase" type="password" autocomplete="off"></label>
    </div>
    <label id="password-field" hidden><span data-i18n="ssh.password"></span><input id="password" type="password" autocomplete="off"></label>
    <p class="muted" data-i18n="ssh.formHint"></p>
    <label class="checkbox"><input id="save-profile" type="checkbox" checked> <span data-i18n="ssh.saveProfile"></span></label>
    <p id="connect-error" class="error" role="alert"></p>
    <div class="dialog-actions">
      <button id="delete-profile" type="button" data-i18n="ssh.deleteProfile"></button>
      <button type="submit" class="primary" id="connect-submit" data-i18n="ssh.connect"></button>
    </div>
  </form>
</dialog>

<dialog id="settings-dialog" aria-labelledby="settings-title">
  <form id="settings-form">
    <div class="dialog-heading">
      <h2 id="settings-title" data-i18n="settings.title"></h2>
      <button type="button" data-close="settings-dialog" data-i18n-label="common.close">✕</button>
    </div>
    <label><span data-i18n="language.label"></span><select id="language"></select></label>
    <p class="muted" data-i18n="settings.fontHint"></p>
    <label><span data-i18n="settings.latinFont"></span><input id="font-latin"></label>
    <label><span data-i18n="settings.cjkFont"></span><input id="font-cjk"></label>
    <label><span data-i18n="settings.emojiFont"></span><input id="font-emoji"></label>
    <label><span data-i18n="settings.mathFont"></span><input id="font-math"></label>
    <label><span data-i18n="settings.fallbackFont"></span><input id="font-fallback"></label>
    <div class="row">
      <label class="grow"><span data-i18n="settings.fontSize"></span><input id="font-size" type="number" min="10" max="32" required></label>
      <label class="grow"><span data-i18n="settings.lineHeight"></span><input id="line-height" type="number" min="1" max="1.8" step="0.05" required></label>
    </div>
    <div id="font-preview"></div>
    <p id="font-info" class="muted"></p>
    <div class="row">
      <label class="grow"><span data-i18n="settings.scrollback"></span><input id="scrollback" type="number" min="1000" max="500000" step="1000" required></label>
      <label class="grow">
        <span data-i18n="settings.renderer"></span>
        <select id="renderer">
          <option value="webgl" data-i18n="settings.webgl"></option>
          <option value="dom" data-i18n="settings.dom"></option>
        </select>
      </label>
    </div>
    <p class="muted" data-i18n="settings.performanceHint"></p>
    <label>
      <span data-i18n="settings.unicode"></span>
      <select id="unicode">
        <option value="15-graphemes" data-i18n="settings.unicode15"></option>
        <option value="11" data-i18n="settings.unicode11"></option>
      </select>
    </label>
    <label class="checkbox"><input id="cursor-blink" type="checkbox"> <span data-i18n="settings.cursorBlink"></span></label>
    <p id="settings-error" class="error" role="alert"></p>
    <div class="dialog-actions">
      <button id="settings-reset" type="button" data-i18n="settings.restoreDefaults"></button>
      <button class="primary" type="submit" data-i18n="settings.save"></button>
    </div>
  </form>
</dialog>

<div id="toast" role="status" hidden></div>
<script type="module" src="app.js"></script>
</body>
</html>
